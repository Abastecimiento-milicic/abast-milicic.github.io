name: Build and deploy Node.js app to Azure Web App - abastecimiento-milicic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga directo tus archivos del repositorio (incluyendo los CSV nuevos)
      - uses: actions/checkout@v4

      # 2. Comprime el JSON grande y arma el zip excluyendo .git, excels crudos y carpetas internas
      - name: Zip artifact for deployment
        run: |
          gzip -k -9 data/partidas_emrf.json
          zip -r release.zip . -x "*.git*" "node_modules/*" ".github/*" "*.xlsx" "scratch/*" "scripts/*" ".agents/*"

      # 3. Sube los archivos directo a producción usando el Perfil de Publicación
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'abastecimiento-milicic'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
