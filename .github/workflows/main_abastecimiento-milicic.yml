name: Build and deploy Node.js app to Azure Web App - abastecimiento-milicic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga directo tus archivos del repositorio
      - uses: actions/checkout@v4

      # 2. Comprime solo los archivos necesarios (excluye .git de 360MB y node_modules)
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "*.git*" "node_modules/*" ".github/*"

      # 3. Sube el paquete optimizado a Azure Web App
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'abastecimiento-milicic'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
          clean: true
